name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleRelease -PciRun=${{ github.run_number }}

      # QuestEnhancer-v<version>-r<run>-<short commit>[-<branch>].apk; main has no
      # branch suffix. The artifact has the same name.
      - name: Name the APK
        id: name
        run: |
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          ref="${{ github.head_ref || github.ref_name }}"
          short=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
          name="QuestEnhancer-v$ver-r${{ github.run_number }}-$short"
          [ "$ref" = main ] || name="$name-${ref##*/}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: out/*.apk
          if-no-files-found: error

  fixes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build Developer Options app
        working-directory: apps/devoptions
        run: gradle --no-daemon :app:assembleDebug
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b           # = 26.1.10909125
      - name: Vendor xHook (iqiyi/xHook v1.2.0, MIT)
        run: |
          git clone --depth 1 --branch v1.2.0 https://github.com/iqiyi/xHook /tmp/xhook
          dst=fixes/07-cast-feedback-shim/jni/xhook
          mkdir -p "$dst"
          cp /tmp/xhook/libxhook/jni/*.c /tmp/xhook/libxhook/jni/*.h "$dst"/
          cp /tmp/xhook/LICENSE "$dst"/LICENSE
      - name: Build cast feedback shim (ndk-build)
        working-directory: fixes/07-cast-feedback-shim
        run: |
          "${{ steps.ndk.outputs.ndk-path }}/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk
      - name: Place shim .so into the module
        run: |
          base=fixes/07-cast-feedback-shim
          rm -f "$base/module/zygisk/.gitkeep"
          mkdir -p "$base/module/zygisk"
          cp "$base/libs/arm64-v8a/libqecastshim.so"   "$base/module/zygisk/arm64-v8a.so"
          cp "$base/libs/armeabi-v7a/libqecastshim.so" "$base/module/zygisk/armeabi-v7a.so"
          ls -l "$base/module/zygisk"
      - name: Short commit
        id: short
        run: echo "sha=$(echo '${{ github.event.pull_request.head.sha || github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Collect APKs and pack Magisk modules
        run: |
          mkdir -p out
          cp apps/devoptions/app/build/outputs/apk/debug/app-debug.apk out/devoptions-${{ github.run_number }}.apk
          for m in fixes/*/module; do
            fix=$(basename "$(dirname "$m")")
            (cd "$m" && zip -r -X "$GITHUB_WORKSPACE/out/$fix-r${{ github.run_number }}.zip" . -x '.gitkeep' -x '*/.gitkeep')
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: quest1-fixes-r${{ github.run_number }}-${{ steps.short.outputs.sha }}
          path: out/
